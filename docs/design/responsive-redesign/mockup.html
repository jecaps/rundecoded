<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RunDecoded responsive redesign reference</title>
  <script src="https://unpkg.com/lucide@1.37.0/dist/umd/lucide.js"></script>
  <style>
    html { background: #f5f7fb; }
    body { margin: 0; padding: 1.5rem; }
    @media (max-width: 48rem) { body { padding: 0.75rem; } }
  </style>
</head>
<body>
<div id="rd-redesign" aria-label="Interactive RunDecoded redesign mockup for phone and tablet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@400;500&display=swap');

    #rd-redesign {
      --rd-page: light-dark(#ffffff, #0f1725);
      --rd-surface: light-dark(#ffffff, #142033);
      --rd-ink: light-dark(#17213b, #f3f6fb);
      --rd-muted: light-dark(#5f6f8c, #afbdd1);
      --rd-primary: light-dark(#2f7bd8, #79aeff);
      --rd-primary-strong: light-dark(#245a9d, #9bc2ff);
      --rd-on-primary: light-dark(#ffffff, #071323);
      --rd-line: light-dark(#d5dfed, #344761);
      --rd-tint: light-dark(#e7eef8, #1c2b40);
      --rd-callout: light-dark(#e4eefb, #182942);
      --rd-photo: light-dark(#f1f5fa, #e8eef7);
      --rd-frame: light-dark(#17213b, #d5dfed);
      color-scheme: light dark;
      color: var(--rd-ink);
      font-family: 'Inter', sans-serif;
      width: 100%;
    }

    #rd-redesign * { box-sizing: border-box; }
    #rd-redesign button { color: inherit; font: inherit; }
    #rd-redesign [hidden] { display: none !important; }
    #rd-redesign svg { stroke-width: 1.8; }

    .rd-stage {
      align-items: start;
      display: grid;
      gap: 1.5rem;
      grid-template-columns: minmax(17.125rem, 0.78fr) minmax(26.875rem, 1.22fr);
      width: 100%;
    }

    .rd-preview { min-width: 0; }
    .rd-preview-label {
      color: var(--rd-muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      margin: 0 0 0.5rem;
      text-align: center;
      text-transform: uppercase;
    }

    .rd-device {
      background: var(--rd-page);
      border: 1.5px solid var(--rd-frame);
      color: var(--rd-ink);
      display: flex;
      font-size: 0.75rem;
      height: 38.125rem;
      margin-inline: auto;
      overflow: hidden;
    }

    .rd-phone { border-radius: 1.5rem; flex-direction: column; max-width: 17.125rem; width: 100%; }
    .rd-tablet { border-radius: 1rem; max-width: 26.875rem; position: relative; width: 100%; }

    .rd-status {
      align-items: end;
      color: var(--rd-muted);
      display: flex;
      flex: 0 0 auto;
      font-size: 0.58rem;
      height: 1.45rem;
      justify-content: space-between;
      padding: 0 1rem 0.25rem;
    }

    .rd-app-main { display: flex; flex: 1; flex-direction: column; min-height: 0; min-width: 0; }
    .rd-header {
      align-items: center;
      background: var(--rd-surface);
      border-bottom: 1px solid var(--rd-line);
      display: flex;
      flex: 0 0 3rem;
      justify-content: space-between;
      padding-inline: 0.9rem 0.2rem;
    }

    .rd-wordmark { font-family: 'Oswald', sans-serif; font-size: 1rem; font-weight: 500; letter-spacing: 0.02em; }
    .rd-wordmark span { color: var(--rd-primary); }
    .rd-icon-button {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 0.3rem;
      cursor: pointer;
      display: inline-flex;
      height: 2.75rem;
      justify-content: center;
      width: 2.75rem;
    }
    .rd-icon-button:hover { background: var(--rd-tint); }
    .rd-icon-button svg { height: 1rem; width: 1rem; }

    .rd-screen { display: flex; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
    .rd-content { flex: 1; min-height: 0; overflow: hidden; }

    .rd-search-row { display: flex; gap: 0.5rem; padding: 0.7rem 0.8rem 0; }
    .rd-search {
      align-items: center;
      background: var(--rd-surface);
      border: 1px solid var(--rd-line);
      border-radius: 0.25rem;
      color: var(--rd-muted);
      display: flex;
      flex: 1;
      font-size: 0.66rem;
      gap: 0.45rem;
      height: 2.75rem;
      min-width: 0;
      padding-inline: 0.65rem;
    }
    .rd-search svg { height: 0.9rem; width: 0.9rem; }
    .rd-filter {
      align-items: center;
      background: var(--rd-ink);
      border: 0;
      border-radius: 0.25rem;
      color: var(--rd-page) !important;
      cursor: pointer;
      display: flex;
      height: 2.75rem;
      justify-content: center;
      position: relative;
      width: 2.75rem;
    }
    .rd-filter svg { height: 0.95rem; width: 0.95rem; }
    .rd-count-badge {
      align-items: center;
      background: var(--rd-primary);
      border-radius: 999px;
      color: var(--rd-on-primary);
      display: flex;
      font-size: 0.65rem;
      height: 1.1rem;
      justify-content: center;
      min-width: 1.1rem;
      padding-inline: 0.25rem;
      position: absolute;
      right: -0.3rem;
      top: -0.3rem;
    }

    .rd-chips { display: flex; gap: 0.32rem; overflow: hidden; padding: 0.5rem 0.8rem; }
    .rd-chip {
      align-items: center;
      background: var(--rd-surface);
      border: 1px solid var(--rd-line);
      border-radius: 0.25rem;
      color: var(--rd-muted);
      display: inline-flex;
      flex: 0 0 auto;
      font-size: 0.62rem;
      gap: 0.25rem;
      height: 2.2rem;
      padding-inline: 0.65rem;
      white-space: nowrap;
    }
    .rd-chip.rd-active { background: var(--rd-primary); border-color: var(--rd-primary); color: var(--rd-on-primary); }
    .rd-chip svg { height: 0.75rem; width: 0.75rem; }
    .rd-result-bar { color: var(--rd-muted); display: flex; font-size: 0.62rem; justify-content: space-between; padding: 0.05rem 0.8rem 0.38rem; }

    .rd-brand-bar { background: var(--rd-tint); border-block: 1px solid var(--rd-line); font-family: 'Oswald', sans-serif; font-size: 0.7rem; padding: 0.24rem 0.8rem; }
    .rd-shoe-row {
      align-items: center;
      border-bottom: 1px solid var(--rd-line);
      display: grid;
      gap: 0.65rem;
      grid-template-columns: 3.5rem minmax(0, 1fr) 2.75rem;
      padding: 0.48rem 0.45rem 0.48rem 0.8rem;
    }
    .rd-shoe-row.rd-selected { background: var(--rd-tint); box-shadow: inset 3px 0 0 var(--rd-primary); }
    .rd-shoe-image {
      align-items: center;
      background: var(--rd-photo);
      border-radius: 0.25rem;
      color: #17213b;
      display: flex;
      height: 3.5rem;
      justify-content: center;
    }
    .rd-shoe-image svg { height: 1.8rem; transform: rotate(-18deg); width: 1.8rem; }
    .rd-shoe-name { font-family: 'Oswald', sans-serif; font-size: 0.88rem; line-height: 1.05; }
    .rd-meta { color: var(--rd-muted); font-size: 0.6rem; margin-top: 0.16rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rd-tags { display: flex; gap: 0.3rem; margin-top: 0.32rem; }
    .rd-tag { background: var(--rd-tint); border-radius: 0.12rem; color: var(--rd-muted); font-size: 0.56rem; padding: 0.15rem 0.28rem; }
    .rd-compare-toggle {
      align-items: center;
      background: var(--rd-surface);
      border: 1px solid var(--rd-line);
      border-radius: 0.25rem;
      cursor: pointer;
      display: flex;
      height: 2.75rem;
      justify-content: center;
      width: 2.75rem;
    }
    .rd-compare-toggle[aria-pressed='true'] { background: var(--rd-primary); border-color: var(--rd-primary); color: var(--rd-on-primary); }
    .rd-compare-toggle svg { height: 0.95rem; width: 0.95rem; }

    .rd-compare-tray {
      align-items: center;
      background: var(--rd-ink);
      border-radius: 0.4rem;
      color: var(--rd-page);
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
      margin: 0.4rem 0.55rem;
      min-height: 2.85rem;
      padding: 0.45rem 0.45rem 0.45rem 0.75rem;
    }
    .rd-compare-tray strong { display: block; font-size: 0.66rem; font-weight: 500; }
    .rd-compare-tray span { font-size: 0.58rem; opacity: 0.72; }
    .rd-tray-action { background: var(--rd-primary); border: 0; border-radius: 0.25rem; color: var(--rd-on-primary) !important; height: 2.2rem; padding-inline: 0.65rem; }

    .rd-phone-tabs {
      background: var(--rd-tint);
      border-radius: 0.45rem;
      display: grid;
      flex: 0 0 3rem;
      gap: 0.15rem;
      grid-template-columns: repeat(4, 1fr);
      margin: 0 0.5rem 0.45rem;
      padding: 0.16rem;
    }
    .rd-phone-tab, .rd-rail-tab {
      align-items: center;
      background: transparent;
      border: 0;
      color: var(--rd-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border-radius: 0.35rem;
      font-size: 0.5rem;
      gap: 0.08rem;
      justify-content: center;
      position: relative;
    }
    .rd-phone-tab .rd-icon-well { align-items: center; display: flex; height: 1rem; justify-content: center; width: 2rem; }
    .rd-phone-tab[aria-selected='true'] { background: var(--rd-primary); color: var(--rd-on-primary); }
    .rd-phone-tab svg, .rd-rail-tab svg { height: 0.78rem; width: 0.78rem; }
    .rd-tab-badge { background: var(--rd-primary); border-radius: 999px; color: var(--rd-on-primary); font-size: 0.58rem; min-width: 1rem; padding: 0.08rem 0.22rem; position: absolute; right: 0.45rem; top: 0.12rem; }

    .rd-rail {
      align-items: center;
      background: var(--rd-surface);
      border-right: 1px solid var(--rd-line);
      display: flex;
      flex: 0 0 4.5rem;
      flex-direction: column;
      gap: 0.25rem;
      padding-block: 0.9rem;
    }
    .rd-logo { align-items: center; background: var(--rd-ink); border-radius: 0.3rem; color: var(--rd-page); display: flex; font-family: 'Oswald', sans-serif; height: 2.4rem; justify-content: center; margin-bottom: 0.75rem; width: 2.4rem; }
    .rd-rail-tab { border-radius: 0.35rem; font-size: 0.55rem; min-height: 3.35rem; width: 3.9rem; }
    .rd-rail-tab .rd-icon-well { align-items: center; display: flex; height: 1.2rem; justify-content: center; width: 2.5rem; }
    .rd-rail-tab[aria-selected='true'] { background: var(--rd-primary); color: var(--rd-on-primary); }

    .rd-tablet .rd-status { height: 1.35rem; }
    .rd-tablet .rd-header { flex-basis: 2.8rem; }
    .rd-tablet .rd-search-row { padding-inline: 1rem; }
    .rd-tablet .rd-chips, .rd-tablet .rd-result-bar { padding-inline: 1rem; }
    .rd-card-grid { display: grid; gap: 0.5rem; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 0 1rem 1rem; }
    .rd-shoe-card { background: var(--rd-surface); border: 1px solid var(--rd-line); border-radius: 0.25rem; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
    .rd-shoe-card .rd-shoe-image { border-radius: 0; height: 4.65rem; }
    .rd-card-body { display: flex; flex: 1; flex-direction: column; padding: 0.55rem; }
    .rd-card-body .rd-shoe-name { min-height: 1.8rem; }
    .rd-card-spec { border-top: 1px solid var(--rd-line); color: var(--rd-primary-strong); font-family: 'Oswald', sans-serif; font-size: 0.75rem; margin-top: auto; padding-top: 0.42rem; }
    .rd-shoe-card .rd-compare-toggle { height: 2.3rem; position: absolute; right: 0.35rem; top: 0.35rem; width: 2.3rem; }

    .rd-simple-screen { padding: 0.9rem; }
    .rd-simple-screen h2 { font-family: 'Oswald', sans-serif; font-size: 1.3rem; font-weight: 500; margin: 0; }
    .rd-simple-screen > p { color: var(--rd-muted); font-size: 0.66rem; margin: 0.22rem 0 0.75rem; }
    .rd-find-panel { background: var(--rd-tint); border-left: 3px solid var(--rd-primary); padding: 0.8rem; }
    .rd-find-panel strong { display: block; font-size: 0.72rem; font-weight: 500; }
    .rd-find-panel p { color: var(--rd-muted); font-size: 0.64rem; margin: 0.2rem 0 0.65rem; }
    .rd-primary-action { align-items: center; background: var(--rd-primary); border: 0; border-radius: 0.4rem; color: var(--rd-on-primary) !important; display: inline-flex; gap: 0.35rem; min-height: 2.75rem; padding-inline: 0.8rem; }

    .rd-topic-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.9rem; }
    .rd-article h3 { font-size: 1.05rem; margin: 0; }
    .rd-article > p { color: var(--rd-muted); font-size: 0.66rem; line-height: 1.5; margin: 0.25rem 0 0.65rem; }
    .rd-article-section { border-top: 1px solid var(--rd-line); padding-block: 0.65rem; }
    .rd-article-section strong { color: var(--rd-primary-strong); display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .rd-article-section p { font-size: 0.66rem; line-height: 1.5; margin: 0.3rem 0 0; }
    .rd-callout { background: var(--rd-callout); border-left: 3px solid var(--rd-primary); font-size: 0.66rem; line-height: 1.45; padding: 0.65rem; }
    .rd-article-link { align-items: center; border-top: 1px solid var(--rd-line); display: flex; font-size: 0.66rem; justify-content: space-between; min-height: 2.6rem; }

    .rd-compare-grid { display: grid; gap: 0.4rem; grid-template-columns: repeat(3, 1fr); }
    .rd-compare-col { min-width: 0; }
    .rd-compare-col .rd-shoe-image { height: 3.6rem; }
    .rd-compare-col h3 { font-family: 'Oswald', sans-serif; font-size: 0.78rem; min-height: 2rem; }
    .rd-metric { border-top: 1px solid var(--rd-line); font-size: 0.66rem; padding-block: 0.45rem; }
    .rd-metric strong { color: var(--rd-primary-strong); display: block; font-family: 'Oswald', sans-serif; font-size: 1rem; }
    .rd-meter { background: var(--rd-tint); border-radius: 999px; height: 0.3rem; margin-top: 0.25rem; overflow: hidden; }
    .rd-meter span { background: var(--rd-primary); display: block; height: 100%; }

    .rd-settings { background: var(--rd-surface); height: 100%; padding: 1rem; }
    .rd-settings h2 { font-family: 'Oswald', sans-serif; font-size: 1.25rem; font-weight: 500; margin: 0 0 0.75rem; }
    .rd-setting-row { align-items: center; border-block: 1px solid var(--rd-line); display: flex; justify-content: space-between; min-height: 4rem; }
    .rd-setting-row + .rd-setting-row { border-top: 0; }
    .rd-setting-row strong { display: block; font-size: 0.78rem; font-weight: 500; }
    .rd-setting-row span { color: var(--rd-muted); font-size: 0.68rem; }
    .rd-language-value { color: var(--rd-muted); font-size: 0.72rem; }
    .rd-segmented { background: var(--rd-tint); border-radius: 0.35rem; display: grid; gap: 0.15rem; grid-template-columns: repeat(3, 1fr); margin-top: 0.75rem; padding: 0.15rem; }
    .rd-segmented button { background: transparent; border: 0; border-radius: 0.25rem; cursor: pointer; min-height: 2.35rem; }
    .rd-segmented button[aria-pressed='true'] { background: var(--rd-primary); color: var(--rd-on-primary); }

    .rd-sheet-scrim { background: color-mix(in srgb, var(--rd-ink) 44%, transparent); inset: 0; position: absolute; z-index: 5; }
    .rd-phone { position: relative; }
    .rd-filter-sheet { background: var(--rd-surface); border-radius: 1rem 1rem 0 0; bottom: 0; left: 0; padding: 0.55rem 1rem 1rem; position: absolute; right: 0; z-index: 6; }
    .rd-filter-panel { background: var(--rd-surface); bottom: 0; border-left: 1px solid var(--rd-line); padding: 1rem; position: absolute; right: 0; top: 0; width: min(19rem, 72%); z-index: 6; }
    .rd-grab { background: var(--rd-line); border-radius: 999px; height: 0.28rem; margin: 0 auto 0.6rem; width: 2.5rem; }
    .rd-sheet-header { align-items: center; display: flex; justify-content: space-between; }
    .rd-sheet-header h3 { font-family: 'Oswald', sans-serif; font-size: 1.2rem; margin: 0; }
    .rd-sheet-group { margin-top: 0.75rem; }
    .rd-sheet-group strong { display: block; font-size: 0.68rem; letter-spacing: 0.08em; margin-bottom: 0.35rem; text-transform: uppercase; }
    .rd-sheet-actions { display: flex; gap: 0.45rem; margin-top: 0.9rem; }
    .rd-sheet-actions .rd-primary-action { flex: 1; justify-content: center; }
    .rd-clear { background: transparent; border: 1px solid var(--rd-line); border-radius: 0.4rem; min-height: 2.75rem; padding-inline: 0.8rem; }

    @media (max-width: 820px) {
      .rd-stage { grid-template-columns: 1fr; }
      .rd-tablet { max-width: 40rem; }
    }

    @media (max-width: 420px) {
      .rd-device { height: 38.125rem; }
      .rd-phone { border-radius: 1.35rem; }
      .rd-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>

  <div class="rd-stage">
    <section class="rd-preview" aria-labelledby="rd-phone-label">
      <p class="rd-preview-label" id="rd-phone-label">Phone · 390 px</p>
      <div class="rd-device rd-phone" data-rd-device="phone">
        <div class="rd-status"><span>9:41</span><span>Wi-Fi · 82%</span></div>
        <div class="rd-app-main">
          <header class="rd-header">
            <div class="rd-wordmark">RUN<span>DECODED</span></div>
            <button class="rd-icon-button" type="button" data-rd-settings aria-label="Open settings"><i data-lucide="settings" aria-hidden="true"></i></button>
          </header>
          <div class="rd-screen" data-rd-screen-host="phone"></div>
          <nav class="rd-phone-tabs" aria-label="Phone navigation">
            <button class="rd-phone-tab" type="button" data-rd-tab="catalogue" aria-selected="true"><span class="rd-icon-well"><i data-lucide="footprints" aria-hidden="true"></i></span><span>Catalogue</span></button>
            <button class="rd-phone-tab" type="button" data-rd-tab="find" aria-selected="false"><span class="rd-icon-well"><i data-lucide="scan-search" aria-hidden="true"></i></span><span>Find</span></button>
            <button class="rd-phone-tab" type="button" data-rd-tab="compare" aria-selected="false"><span class="rd-icon-well"><i data-lucide="columns-2" aria-hidden="true"></i></span><span>Compare</span><span class="rd-tab-badge" data-rd-compare-count>2</span></button>
            <button class="rd-phone-tab" type="button" data-rd-tab="basics" aria-selected="false"><span class="rd-icon-well"><i data-lucide="book-open" aria-hidden="true"></i></span><span>Basics</span></button>
          </nav>
        </div>
        <div data-rd-overlay-host="phone"></div>
      </div>
    </section>

    <section class="rd-preview" aria-labelledby="rd-tablet-label">
      <p class="rd-preview-label" id="rd-tablet-label">iPad mini · portrait</p>
      <div class="rd-device rd-tablet" data-rd-device="tablet">
        <nav class="rd-rail" aria-label="Tablet navigation">
          <div class="rd-logo">RD</div>
          <button class="rd-rail-tab" type="button" data-rd-tab="catalogue" aria-selected="true"><span class="rd-icon-well"><i data-lucide="footprints" aria-hidden="true"></i></span><span>Catalogue</span></button>
          <button class="rd-rail-tab" type="button" data-rd-tab="find" aria-selected="false"><span class="rd-icon-well"><i data-lucide="scan-search" aria-hidden="true"></i></span><span>Find</span></button>
          <button class="rd-rail-tab" type="button" data-rd-tab="compare" aria-selected="false"><span class="rd-icon-well"><i data-lucide="columns-2" aria-hidden="true"></i></span><span>Compare</span><span class="rd-tab-badge" data-rd-compare-count>2</span></button>
          <button class="rd-rail-tab" type="button" data-rd-tab="basics" aria-selected="false"><span class="rd-icon-well"><i data-lucide="book-open" aria-hidden="true"></i></span><span>Basics</span></button>
        </nav>
        <div class="rd-app-main">
          <div class="rd-status"><span>9:41</span><span>Wi-Fi · 82%</span></div>
          <header class="rd-header">
            <div class="rd-wordmark">RUN<span>DECODED</span></div>
            <button class="rd-icon-button" type="button" data-rd-settings aria-label="Open settings"><i data-lucide="settings" aria-hidden="true"></i></button>
          </header>
          <div class="rd-screen" data-rd-screen-host="tablet"></div>
        </div>
        <div data-rd-overlay-host="tablet"></div>
      </div>
    </section>
  </div>

  <script>
    const rdRoot = document.getElementById('rd-redesign');
    const rdState = { activeScreen: 'catalogue', compareCount: 2, filtersOpen: false, filterDevice: 'phone', settingsOpen: false, appearance: 'system' };

    const rdShoes = [
      { brand: 'Adidas', name: 'Adistar 5', purpose: 'Max cushion', best: 'Long easy road runs', distance: 42, drop: 6 },
      { brand: 'Adidas', name: 'Adizero Boston 13', purpose: 'Fast training', best: 'Tempo and long fast runs', distance: 42, drop: 8 },
      { brand: 'Adidas', name: 'Adizero Evo SL', purpose: 'Fast training', best: 'Fast training · race day', distance: 21, drop: 6 },
      { brand: 'Asics', name: 'Gel Kayano 32', purpose: 'Stability', best: 'Stable daily road runs', distance: 42, drop: 8 },
      { brand: 'Asics', name: 'Dynablast 5', purpose: 'Daily training', best: 'Dynamic daily runs', distance: 42, drop: 8 },
      { brand: 'Asics', name: 'Gel Excite 11', purpose: 'Entry level', best: 'Easy daily road runs', distance: 10, drop: 8 }
    ];

    function rdIcon(name) {
      return `<i data-lucide="${name}" aria-hidden="true"></i>`;
    }

    function rdCataloguePhone() {
      return `<div class="rd-content">
        <div class="rd-search-row"><div class="rd-search">${rdIcon('search')}<span>Search brand or model</span></div><button class="rd-filter" type="button" data-rd-filter aria-label="Open filters">${rdIcon('sliders-horizontal')}<span class="rd-count-badge">2</span></button></div>
        <div class="rd-chips"><button class="rd-chip rd-active" type="button">${rdIcon('check')}All</button><button class="rd-chip" type="button">Daily</button><button class="rd-chip" type="button">Fast</button><button class="rd-chip" type="button">Trail</button></div>
        <div class="rd-result-bar"><span>106 shoes</span><span>Sort: A–Z</span></div>
        <div class="rd-brand-bar">Adidas</div>
        ${rdShoes.slice(0, 3).map((shoe, index) => `<article class="rd-shoe-row${index === 0 ? ' rd-selected' : ''}"><div class="rd-shoe-image">${rdIcon('footprints')}</div><div><div class="rd-shoe-name">${shoe.name}</div><div class="rd-tags"><span class="rd-tag">${shoe.purpose}</span></div><div class="rd-meta">${shoe.best}</div><div class="rd-meta">${shoe.distance} km · ${shoe.drop} mm drop</div></div><button class="rd-compare-toggle" type="button" aria-label="${index < 2 ? 'Remove' : 'Add'} ${shoe.name} ${index < 2 ? 'from' : 'to'} comparison" aria-pressed="${index < 2}">${rdIcon(index < 2 ? 'check' : 'plus')}</button></article>`).join('')}
      </div><div class="rd-compare-tray"><div><strong>2 shoes selected</strong><span>Adistar 5 + Boston 13</span></div><button class="rd-tray-action" type="button" data-rd-go-compare>Compare</button></div>`;
    }

    function rdCatalogueTablet() {
      return `<div class="rd-content"><div class="rd-search-row"><div class="rd-search">${rdIcon('search')}<span>Search brand, model or technology</span></div><button class="rd-filter" type="button" data-rd-filter aria-label="Open filters">${rdIcon('sliders-horizontal')}<span class="rd-count-badge">2</span></button></div><div class="rd-chips"><button class="rd-chip rd-active" type="button">${rdIcon('check')}All</button><button class="rd-chip" type="button">Daily training</button><button class="rd-chip" type="button">Fast training</button><button class="rd-chip" type="button">Trail</button><button class="rd-chip" type="button">Stability</button></div><div class="rd-result-bar"><span>106 shoes · all categories</span><span>Sort: A–Z</span></div><div class="rd-card-grid">${rdShoes.map((shoe, index) => `<article class="rd-shoe-card"><div class="rd-shoe-image">${rdIcon('footprints')}</div><button class="rd-compare-toggle" type="button" aria-label="${index < 2 ? 'Remove' : 'Add'} ${shoe.name} ${index < 2 ? 'from' : 'to'} comparison" aria-pressed="${index < 2}">${rdIcon(index < 2 ? 'check' : 'plus')}</button><div class="rd-card-body"><div class="rd-shoe-name">${shoe.name}</div><div class="rd-tags"><span class="rd-tag">${shoe.purpose}</span></div><div class="rd-meta">${shoe.best}</div><div class="rd-card-spec">${shoe.distance} km · ${shoe.drop} mm drop</div></div></article>`).join('')}</div></div><div class="rd-compare-tray"><div><strong>2 shoes selected</strong><span>Ready to compare</span></div><button class="rd-tray-action" type="button" data-rd-go-compare>Compare</button></div>`;
    }

    function rdFind() {
      return `<div class="rd-content rd-simple-screen"><h2>Find my shoe</h2><p>A short guided consultation using the same catalogue data.</p><div class="rd-find-panel"><strong>What will the shoe be used for?</strong><p>Choose the closest match. You can refine the recommendation next.</p><div class="rd-topic-chips"><button class="rd-chip rd-active" type="button">${rdIcon('check')}Daily runs</button><button class="rd-chip" type="button">Faster runs</button><button class="rd-chip" type="button">Trail</button></div><button class="rd-primary-action" type="button">Continue ${rdIcon('arrow-right')}</button></div></div>`;
    }

    function rdCompare() {
      const selected = rdShoes.slice(0, 3);
      return `<div class="rd-content rd-simple-screen"><h2>Compare</h2><p>Shared scales make the differences visible at a glance.</p><div class="rd-compare-grid">${selected.map((shoe) => `<div class="rd-compare-col"><div class="rd-shoe-image">${rdIcon('footprints')}</div><h3>${shoe.name}</h3><div class="rd-metric"><span>Distance</span><strong>${shoe.distance} km</strong><div class="rd-meter"><span style="width:${shoe.distance / 80 * 100}%"></span></div></div><div class="rd-metric"><span>Drop</span><strong>${shoe.drop} mm</strong><div class="rd-meter"><span style="width:${shoe.drop / 12 * 100}%"></span></div></div><div class="rd-metric"><span>Purpose</span><strong>${shoe.purpose}</strong></div></div>`).join('')}</div></div>`;
    }

    function rdBasics() {
      return `<div class="rd-content rd-simple-screen"><h2>Running Basics</h2><p>Mechanics and shoe features that shape how a run feels.</p><div class="rd-topic-chips"><button class="rd-chip" type="button">Pronation</button><button class="rd-chip" type="button">Foot strike</button><button class="rd-chip rd-active" type="button">${rdIcon('check')}Drop</button><button class="rd-chip" type="button">Stack height</button><button class="rd-chip" type="button">Cushioning</button></div><article class="rd-article"><h3>Drop</h3><p>The height difference between heel and forefoot, measured in millimetres.</p><div class="rd-article-section"><strong>What it is</strong><p>Drop changes the relative height of the foot inside the shoe. It does not describe how soft or protective the shoe is.</p></div><div class="rd-article-section"><strong>What it changes</strong><p>It can shape how much work is felt through the calf and Achilles.</p></div><div class="rd-callout">A specification is a clue, not a verdict. Fit, comfort, and intended use still matter.</div><div class="rd-article-link"><span>Browse shoes by drop</span>${rdIcon('chevron-right')}</div><div class="rd-article-link"><span>Next: Stack height</span>${rdIcon('chevron-right')}</div></article></div>`;
    }

    function rdSettings() {
      return `<div class="rd-settings"><h2>Settings</h2><div class="rd-setting-row"><div><strong>Language</strong><span>Used for all text in the app</span></div><div class="rd-language-value">English ${rdIcon('chevron-right')}</div></div><div class="rd-setting-row"><div><strong>Appearance</strong><span>Following your device: light</span></div></div><div class="rd-segmented" aria-label="Appearance"><button type="button" data-rd-appearance="system" aria-pressed="${rdState.appearance === 'system'}">System</button><button type="button" data-rd-appearance="light" aria-pressed="${rdState.appearance === 'light'}">Light</button><button type="button" data-rd-appearance="dark" aria-pressed="${rdState.appearance === 'dark'}">Dark</button></div></div>`;
    }

    function rdFilterSheet() {
      return `<div class="rd-sheet-scrim" data-rd-close-filter></div><section class="rd-filter-sheet" aria-label="Filters"><div class="rd-grab"></div><div class="rd-sheet-header"><h3>Filters</h3><button class="rd-icon-button" type="button" data-rd-close-filter aria-label="Close filters">${rdIcon('x')}</button></div><div class="rd-sheet-group"><strong>Purpose</strong><div class="rd-topic-chips"><button class="rd-chip rd-active" type="button">${rdIcon('check')}Daily training</button><button class="rd-chip" type="button">Fast training</button><button class="rd-chip" type="button">Trail</button></div></div><div class="rd-sheet-group"><strong>Guidance</strong><div class="rd-topic-chips"><button class="rd-chip" type="button">Neutral</button><button class="rd-chip rd-active" type="button">${rdIcon('check')}Stability</button></div></div><div class="rd-sheet-actions"><button class="rd-clear" type="button">Clear all</button><button class="rd-primary-action" type="button" data-rd-close-filter>Show 31 shoes</button></div></section>`;
    }

    function rdFilterPanel() {
      return `<div class="rd-sheet-scrim" data-rd-close-filter></div><section class="rd-filter-panel" aria-label="Filters"><div class="rd-sheet-header"><h3>Filters</h3><button class="rd-icon-button" type="button" data-rd-close-filter aria-label="Close filters">${rdIcon('x')}</button></div><div class="rd-sheet-group"><strong>Purpose</strong><div class="rd-topic-chips"><button class="rd-chip rd-active" type="button">${rdIcon('check')}Daily training</button><button class="rd-chip" type="button">Fast training</button><button class="rd-chip" type="button">Trail</button></div></div><div class="rd-sheet-group"><strong>Guidance</strong><div class="rd-topic-chips"><button class="rd-chip" type="button">Neutral</button><button class="rd-chip rd-active" type="button">${rdIcon('check')}Stability</button></div></div><div class="rd-sheet-actions"><button class="rd-clear" type="button">Clear all</button><button class="rd-primary-action" type="button" data-rd-close-filter>Show 31 shoes</button></div></section>`;
    }

    function rdScreenMarkup(device) {
      if (rdState.settingsOpen) return rdSettings();
      if (rdState.activeScreen === 'find') return rdFind();
      if (rdState.activeScreen === 'compare') return rdCompare();
      if (rdState.activeScreen === 'basics') return rdBasics();
      return device === 'phone' ? rdCataloguePhone() : rdCatalogueTablet();
    }

    function rdRender() {
      rdRoot.querySelectorAll('[data-rd-screen-host]').forEach((host) => {
        host.innerHTML = rdScreenMarkup(host.dataset.rdScreenHost);
      });
      rdRoot.querySelectorAll('[data-rd-tab]').forEach((tab) => {
        tab.setAttribute('aria-selected', String(!rdState.settingsOpen && tab.dataset.rdTab === rdState.activeScreen));
      });
      rdRoot.querySelectorAll('[data-rd-compare-count]').forEach((badge) => { badge.textContent = rdState.compareCount; });
      const phoneOverlay = rdRoot.querySelector('[data-rd-overlay-host="phone"]');
      const tabletOverlay = rdRoot.querySelector('[data-rd-overlay-host="tablet"]');
      phoneOverlay.innerHTML = rdState.filtersOpen && rdState.filterDevice === 'phone' ? rdFilterSheet() : '';
      tabletOverlay.innerHTML = rdState.filtersOpen && rdState.filterDevice === 'tablet' ? rdFilterPanel() : '';
      rdRoot.dataset.appearance = rdState.appearance;
      if (rdState.appearance === 'dark') rdRoot.style.colorScheme = 'dark';
      else if (rdState.appearance === 'light') rdRoot.style.colorScheme = 'light';
      else rdRoot.style.colorScheme = 'light dark';
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    rdRoot.addEventListener('click', (event) => {
      const tab = event.target.closest('[data-rd-tab]');
      const settings = event.target.closest('[data-rd-settings]');
      const filter = event.target.closest('[data-rd-filter]');
      const closeFilter = event.target.closest('[data-rd-close-filter]');
      const compare = event.target.closest('[data-rd-go-compare]');
      const appearance = event.target.closest('[data-rd-appearance]');

      if (tab) {
        rdState.activeScreen = tab.dataset.rdTab;
        rdState.settingsOpen = false;
        rdRender();
      } else if (settings) {
        rdState.settingsOpen = true;
        rdRender();
      } else if (filter) {
        rdState.filtersOpen = true;
        rdState.filterDevice = filter.closest('[data-rd-device]').dataset.rdDevice;
        rdRender();
      } else if (closeFilter) {
        rdState.filtersOpen = false;
        rdRender();
      } else if (compare) {
        rdState.activeScreen = 'compare';
        rdRender();
      } else if (appearance) {
        rdState.appearance = appearance.dataset.rdAppearance;
        rdRender();
      }
    });

    rdRender();

    if (globalThis.Tweak) {
      const rdTweak = new Tweak({ container: rdRoot, onChange: rdRender });
      rdTweak.addSelect(rdState, 'activeScreen', { label: 'Preview screen', options: [
        { label: 'Catalogue', value: 'catalogue' },
        { label: 'Find', value: 'find' },
        { label: 'Compare', value: 'compare' },
        { label: 'Basics', value: 'basics' }
      ], reference: 'app.active_screen' });
      rdTweak.addSelect(rdState, 'appearance', { label: 'Appearance', options: [
        { label: 'System', value: 'system' },
        { label: 'Light', value: 'light' },
        { label: 'Dark', value: 'dark' }
      ], reference: 'app.appearance' });
      rdTweak.addToggle(rdState, 'settingsOpen', { label: 'Show settings', reference: 'app.settings_open' });
    }
  </script>
</div>
</body>
</html>
