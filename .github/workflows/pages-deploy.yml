name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Node and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

      - name: Verify localized Pages output
        run: pnpm verify:pages

      - name: Verify production asset budgets
        run: pnpm verify:performance

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 5 --retry-delay 2 "${PAGE_URL}en/catalogue/"
          curl --fail --location --retry 5 --retry-delay 2 "${PAGE_URL}de/running-basics/"
          curl --fail --location --retry 5 --retry-delay 2 "${PAGE_URL}fr/running-basics/"
